[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlog"
version = "0.10.0"
description = "Multi-agent, multi-device activity pool synced via private GitHub repo"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "yrzhe" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
agentlog = "agentlog.cli:main"

[project.urls]
Homepage = "https://github.com/yrzhe/yrzhe_skill"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentlog*"]

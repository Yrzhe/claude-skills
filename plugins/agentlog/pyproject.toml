[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlog"
version = "0.11.0"
description = "Multi-agent, multi-device activity pool + project context layer. Captures Claude Code / Codex / Cursor / Maestri / browser-use sessions to a shared GitHub-synced pool, and distills per-project state into AGENTS.md + CLAUDE.md."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "yrzhe" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.scripts]
agentlog = "agentlog.cli:main"

[project.urls]
Homepage = "https://github.com/yrzhe/yrzhe_skill"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentlog*"]
